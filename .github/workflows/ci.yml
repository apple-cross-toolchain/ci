on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build_ported_tools:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v2
      - run: tools/build.sh
  strip_clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: tools/strip-clang.sh
  strip_swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: tools/strip-swift.sh
